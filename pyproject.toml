[project]
name = "sciencebeam-trainer-grobid-tools"
version = "0.0.0"
description = "ScienceBeam Trainer - Tools for GROBID training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apache-beam[gcp]>=2.69.0",
    "gcloud>=0.18.3",
    "google-api-python-client>=2.191.0",
    "lxml>=6.0.2",
    "numpy>=2.0.2",
    "regex>=2026.1.15",
    "sciencebeam-alignment>=0.0.6",
    "sciencebeam-utils>=0.1.6",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.19.1",
    "pylint>=4.0.5",
    "pytest>=9.0.2",
    "pytest-watch>=4.2.0",
]
